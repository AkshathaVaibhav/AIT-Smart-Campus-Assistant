<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atria Campus Assistant</title>
    <style>
        :root {
            --primary: #a72c33; 
            --primary-dark: #822026;
            --primary-light: #fef2f2;
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            --chat-bg: #ffffff;
            --bot-bubble: #f1f5f9;
            --text-dark: #0f172a;
            --text-light: #64748b;
            --shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
        }

        body { 
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif; 
            background: var(--bg-gradient); 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
            color: var(--text-dark);
        }

        .chat-container { 
            width: 480px; 
            height: 680px; 
            background: var(--chat-bg); 
            box-shadow: var(--shadow); 
            border-radius: 28px; 
            display: flex; 
            flex-direction: column; 
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* ✨ Creative UI Header Design */
        .chat-header { 
            background: linear-gradient(135deg, #ffffff 0%, #f8fafc 100%);
            padding: 16px 20px; 
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #e2e8f0;
            position: relative;
        }

        .brand-deck {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        /* Updated Custom Geometric Brand Logo Symbol with AIT */
        .creative-logo-mark {
            width: 42px;
            height: 42px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 12px rgba(167, 44, 51, 0.3);
        }

        .creative-logo-mark span {
            color: white;
            font-weight: 900;
            font-size: 14px;
            letter-spacing: 0.5px;
        }

        .title-meta {
            display: flex;
            flex-direction: column;
        }

        .title-meta h1 {
            margin: 0;
            font-size: 16px;
            font-weight: 800;
            color: var(--text-dark);
            letter-spacing: 0.5px;
        }

        .title-meta p {
            margin: 2px 0 0 0;
            font-size: 9.5px;
            font-weight: 600;
            color: var(--text-light);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Modern Status Badge Array */
        .status-container {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .pill-badge {
            background: var(--primary-light);
            color: var(--primary);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.3px;
            border: 1px solid rgba(167, 44, 51, 0.15);
        }

        .live-dot {
            width: 8px;
            height: 8px;
            background: #10b981;
            border-radius: 50%;
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.2);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.4); }
            70% { box-shadow: 0 0 0 6px rgba(16, 185, 129, 0); }
            100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }

        /* Conversation Deck */
        .chat-box { 
            flex: 1; 
            padding: 24px; 
            overflow-y: auto; 
            display: flex; 
            flex-direction: column; 
            gap: 16px; 
            background: #f8fafc;
        }

        .message-row {
            display: flex;
            align-items: flex-end;
            gap: 10px;
            max-width: 85%;
        }

        .row-user { align-self: flex-end; flex-direction: row-reverse; }
        .row-bot { align-self: flex-start; }

        .message { 
            padding: 12px 18px; 
            border-radius: 20px; 
            font-size: 0.95em; 
            line-height: 1.5; 
        }

        .user-msg { 
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white; 
            border-bottom-right-radius: 4px;
            box-shadow: 0 4px 12px rgba(167, 44, 51, 0.15);
        }

        .bot-msg { 
            background: var(--chat-bg); 
            color: var(--text-dark); 
            border-bottom-left-radius: 4px;
            box-shadow: 0 2px 6px rgba(15, 23, 42, 0.04);
            border: 1px solid #e2e8f0;
        }

        .mini-avatar {
            width: 30px;
            height: 30px;
            background: var(--primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 11px;
            font-weight: 800;
        }

        /* Input System */
        .input-area { 
            display: flex; 
            align-items: center;
            border-top: 1px solid #e2e8f0; 
            padding: 16px 20px; 
            background: #ffffff; 
            gap: 12px;
        }

        .input-area input { 
            flex: 1; 
            padding: 14px 20px; 
            border: 1px solid #cbd5e1; 
            border-radius: 26px; 
            outline: none; 
            font-size: 0.95em; 
            background: #f8fafc;
            transition: all 0.2s;
        }

        .input-area input:focus {
            border-color: var(--primary);
            background: #ffffff;
            box-shadow: 0 0 0 3px rgba(167, 44, 51, 0.1);
        }

        .input-area button { 
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white; 
            border: none; 
            width: 46px;
            height: 46px;
            border-radius: 50%;
            cursor: pointer; 
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 12px rgba(167, 44, 51, 0.2);
            transition: transform 0.1s;
        }

        .input-area button:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">
        <div class="brand-deck">
            <div class="creative-logo-mark">
                <span>AIT</span>
            </div>
            <div class="title-meta">
                <h1>Campus Assistant</h1>
                <p>Atria Institute of Technology</p>
            </div>
        </div>
        
        <div class="status-container">
            <div class="pill-badge">NAAC A++</div>
            <div class="live-dot"></div>
        </div>
    </div>

    <div class="chat-box" id="chatBox">
        <div class="message-row row-bot">
            <div class="mini-avatar">AIT</div>
            <div class="message bot-msg">Hello! Ask me anything about Atria Institute of Technology.</div>
        </div>
    </div>

    <div class="input-area">
        <input type="text" id="userInput" placeholder="Ask a campus question..." onkeypress="handleKeyPress(event)">
        <button id="sendBtn" onclick="sendMessage()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <line x1="22" y1="2" x2="11" y2="13"></line>
                <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
            </svg>
        </button>
    </div>
</div>

<script>
    function handleKeyPress(event) {
        if (event.key === "Enter") { sendMessage(); }
    }

    async function sendMessage() {
        const inputField = document.getElementById("userInput");
        const messageText = inputField.value.trim();
        if (!messageText) return;

        appendMessage(messageText, true);
        inputField.value = "";

        try {
            const response = await fetch("http://127.0.0.1:5000/chat", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ message: messageText })
            });
            const data = await response.json();
            appendMessage(data.response, false);
        } catch (error) {
            appendMessage("Error communicating with your backend server.", false);
        }
    }

    function appendMessage(text, isUser) {
        const chatBox = document.getElementById("chatBox");
        const rowDiv = document.createElement("div");
        rowDiv.className = `message-row ${isUser ? 'row-user' : 'row-bot'}`;
        
        rowDiv.innerHTML = `
            ${!isUser ? '<div class="mini-avatar">AIT</div>' : ''}
            <div class="message ${isUser ? 'user-msg' : 'bot-msg'}">${text}</div>
        `;
        chatBox.appendChild(rowDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
    }
</script>

</body>
</html>
