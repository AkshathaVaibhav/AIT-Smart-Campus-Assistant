<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atria Campus Assistant</title>
    <style>
        :root {
            --primary: #a72c33; 
            --primary-dark: #822026;
            --primary-light: #fef2f2;
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            --chat-bg: #ffffff;
            --text-dark: #0f172a;
            --text-light: #64748b;
            --shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
        }

        body { 
            font-family: 'Segoe UI', sans-serif; 
            background: var(--bg-gradient); 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
        }

        .chat-container { 
            width: 480px; height: 680px; background: var(--chat-bg); 
            box-shadow: var(--shadow); border-radius: 28px; 
            display: flex; flex-direction: column; overflow: hidden;
        }

        .chat-header { 
            padding: 16px 20px; display: flex; align-items: center;
            justify-content: space-between; border-bottom: 1px solid #e2e8f0;
        }

        .chat-box { flex: 1; padding: 24px; overflow-y: auto; background: #f8fafc; display: flex; flex-direction: column; gap: 16px; }

        .message-row { display: flex; align-items: flex-end; gap: 10px; max-width: 85%; }
        .row-user { align-self: flex-end; flex-direction: row-reverse; }
        .message { padding: 12px 18px; border-radius: 20px; font-size: 0.95em; }
        .user-msg { background: var(--primary); color: white; }
        .bot-msg { background: #e2e8f0; color: var(--text-dark); }
        .mini-avatar { width: 30px; height: 30px; background: var(--primary); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-size: 11px; }

        .input-area { display: flex; padding: 16px 20px; background: #ffffff; gap: 12px; border-top: 1px solid #e2e8f0; }
        .input-area input { flex: 1; padding: 14px 20px; border: 1px solid #cbd5e1; border-radius: 26px; outline: none; }
        .input-area button { background: var(--primary); color: white; border: none; width: 46px; height: 46px; border-radius: 50%; cursor: pointer; }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">
        <div><h1>Campus Assistant</h1><p>Atria Institute of Technology</p></div>
    </div>

    <div class="chat-box" id="chatBox">
        <div class="message-row row-bot">
            <div class="mini-avatar">AIT</div>
            <div class="message bot-msg">Hello! Ask me anything about Atria.</div>
        </div>
    </div>

    <div class="input-area">
        <input type="text" id="userInput" placeholder="Ask a campus question..." onkeypress="handleKeyPress(event)">
        <button onclick="sendMessage()">Send</button>
    </div>
</div>

<script>
    function handleKeyPress(event) { if (event.key === "Enter") sendMessage(); }

    async function sendMessage() {
        const inputField = document.getElementById("userInput");
        const messageText = inputField.value.trim();
        if (!messageText) return;

        appendMessage(messageText, true);
        inputField.value = "";

        try {
            const response = await fetch("https://ait-smart-campus-assistant.onrender.com/api/chat", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ message: messageText })
            });
            
            // NEW: If the server crashes, catch the text and print it
            if (!response.ok) {
                const errorText = await response.text();
                appendMessage(`Server crashed with status ${response.status}: ${errorText}`, false);
                return;
            }

            const data = await response.json();
            appendMessage(data.response, false);
            
        } catch (error) {
            // NEW: Print the EXACT network error
            appendMessage(`Network Error: ${error.message}`, false);
        }
    }

    function appendMessage(text, isUser) {
        const chatBox = document.getElementById("chatBox");
        const rowDiv = document.createElement("div");
        rowDiv.className = `message-row ${isUser ? 'row-user' : 'row-bot'}`;
        rowDiv.innerHTML = `${!isUser ? '<div class="mini-avatar">AIT</div>' : ''}<div class="message ${isUser ? 'user-msg' : 'bot-msg'}">${text}</div>`;
        chatBox.appendChild(rowDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
    }
</script>

</body>
</html>
